# Serves the SPA and proxies /api to the BFF, so the browser talks to one origin
# (session cookie + CSRF cookie, no CORS).
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://portal-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Running a report waits for the n8n workflow to finish.
        proxy_read_timeout 200s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
